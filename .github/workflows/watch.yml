name: trading-agent
on:
  workflow_dispatch:          # 唯一入口: 由 cron-job.org 每15分钟触发(不用GitHub自带schedule, 其执行率过低)
    inputs:
      push_test:              # 2026-10-03: 1 = 只推送一张测试图, 不做任何交易
        description: "1=图表推送测试(不下单)"
        required: false
        default: "0"
      force_daily:            # 2026-10-03: 1 = 强制推一次日报(测试模板用, 不改状态)
        description: "1=强制推日报(不下单)"
        required: false
        default: "0"
permissions:
  contents: write             # 允许提交 state.json (可靠持久化)
concurrency:
  group: nighthunter          # 串行执行: 防止高频触发时两轮同时下单(重复开仓)
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          pip install requests matplotlib pandas smartmoneyconcepts==0.0.27
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: 运行盯盘引擎
        env:
          # ★2026-10-04 用户裁定: 下单已从 OKX 整体切到 WEEX 模拟盘(不再保留 OKX)
          WEEX_API_KEY: ${{ secrets.WEEX_API_KEY }}
          WEEX_API_SECRET: ${{ secrets.WEEX_API_SECRET }}
          WEEX_API_PASSPHRASE: ${{ secrets.WEEX_API_PASSPHRASE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # ★2026-10-05 (P3-11): 运行日报同步到知识库 wind/05-运行日报(未配置则自动跳过, 不影响交易)
          IMA_OPENAPI_CLIENTID: ${{ secrets.IMA_OPENAPI_CLIENTID }}
          IMA_OPENAPI_APIKEY: ${{ secrets.IMA_OPENAPI_APIKEY }}
          # ★★2026-10-07 用户裁定: 改为【信号提示模式】—— 只推信号+标注图, 不下任何单, 决策权回到用户自己
          #   (要恢复自动模拟盘下单: 把下面改成 "0" 即可, 无需改动其它任何文件)
          DRY_RUN: "1"          # 1=只提示不下单(现行) / 0=自动模拟盘交易
          CAPITAL_USD: "100"    # 账户总资金(2026-10-06 用户明确: 100 USDT)
          PUSH_TEST: ${{ inputs.push_test }}   # 2026-10-03: 1=只推测试图不下单
          FORCE_DAILY: ${{ inputs.force_daily }}   # 2026-10-03: 1=强制推日报(测试模板)
        run: python engine/main.py
      - name: 状态持久化(提交到仓库)
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add engine/state.json engine/reports
          git diff --staged --quiet || git commit -m "state: $(date -u '+%m-%d %H:%M')"
          git push || echo "推送失败(下轮自动重试)"
