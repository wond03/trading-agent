name: trading-agent
on:
  workflow_dispatch: {}       # 唯一入口: 由 cron-job.org 每15分钟触发(不用GitHub自带schedule, 其执行率过低)
permissions:
  contents: write             # 允许提交 state.json (可靠持久化)
concurrency:
  group: nighthunter          # 串行执行: 防止高频触发时两轮同时下单(重复开仓)
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests
      - name: 运行盯盘引擎
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DRY_RUN: "0"          # 真实模拟盘交易
          CAPITAL_USD: "100000" # 模拟盘账户资金
        run: python engine/main.py
      - name: 状态持久化(提交到仓库)
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add engine/state.json
          git diff --staged --quiet || git commit -m "state: $(date -u '+%m-%d %H:%M')"
          git push || echo "推送失败(下轮自动重试)"
