name: trading-agent
on:
  schedule:
    - cron: '*/5 * * * *'    # 2026-10-02: 提高频率攒样本; 主力靠 cron-job.org 频繁触发(建议5分钟)
  workflow_dispatch: {}       # cron-job.org 通过 API 触发此入口
permissions:
  contents: write             # 允许提交 state.json (可靠持久化)
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests
      - name: 运行盯盘引擎
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DRY_RUN: "0"          # 真实模拟盘交易
          CAPITAL_USD: "100000" # 模拟盘账户资金(用于仓位上限)
        run: python engine/main.py
      - name: 状态持久化(提交到仓库)
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add engine/state.json
          git diff --staged --quiet || git commit -m "state: $(date -u '+%m-%d %H:%M')"
          git push || echo "推送失败(下轮自动重试)"
