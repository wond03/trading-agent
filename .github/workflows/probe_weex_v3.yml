name: probe-weex-v3
# 一次性探测: 确认 WEEX v3 行情接口(v2 已于 2026-09-30 下线)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 探测 v3 行情接口
        run: python tools/probe_weex_v3.py
