name: probe-weex-pos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 探测
        env:
          WEEX_API_KEY: ${{ secrets.WEEX_API_KEY }}
          WEEX_API_SECRET: ${{ secrets.WEEX_API_SECRET }}
          WEEX_API_PASSPHRASE: ${{ secrets.WEEX_API_PASSPHRASE }}
        run: python probe_weex_pos.py
